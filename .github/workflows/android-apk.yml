name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android project
        run: flutter create --platforms=android --project-name=coss_brief_pro --org=uk.co.cossbriefpro .
      - name: Get dependencies
        run: flutter pub get
      - name: Remove generated template test
        run: rm -f test/widget_test.dart
      - name: Analyze
        run: flutter analyze
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Verify APK exists
        run: |
          ls -lh build/app/outputs/flutter-apk/
          test -s build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: coss-brief-pro-latest-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
